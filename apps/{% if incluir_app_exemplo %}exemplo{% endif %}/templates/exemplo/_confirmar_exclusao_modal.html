<!-- apps/exemplo/templates/exemplo/_confirmar_exclusao_modal.html -->
<div x-data="{ aberto: true, fechar() { this.aberto = false; $el.closest('#modal-container').innerHTML = ''; } }"
     x-show="aberto"
     @keydown.escape.window="fechar()"
     class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm transition-opacity"
     role="dialog"
     aria-modal="true"
     aria-labelledby="modal-excluir-titulo">

  <div class="relative w-full max-w-md rounded-sm border border-grid bg-surface shadow-lg overflow-hidden flex flex-col dark:bg-surface-3 dark:shadow-md"
       @click.outside="fechar()">

    <!-- Cabeçalho -->
    <div class="flex items-center justify-between border-b border-grid px-6 py-4 bg-surface-2">
      <h2 id="modal-excluir-titulo" class="text-base font-semibold text-ink flex items-center gap-2">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-red-600" aria-hidden="true">
          <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
        </svg>
        <span>Excluir Item</span>
      </h2>
      <button type="button"
              @click="fechar()"
              class="rounded-sm p-1 text-muted hover:text-ink hover:bg-surface transition-colors"
              aria-label="Fechar modal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>

    <!-- Conteúdo / Pergunta -->
    <div class="p-6">
      <p class="text-sm text-ink-2">
        Tem certeza que deseja excluir o item <strong class="text-ink font-semibold">"{{ item.titulo }}"</strong>?
      </p>
      <p class="text-xs text-muted mt-2">
        Esta ação não pode ser desfeita.
      </p>
    </div>

    <!-- Formulário de confirmação -->
    <form hx-post="{% url 'exemplo:item_excluir' item.pk %}"
          hx-target="#modal-container"
          hx-swap="innerHTML"
          class="flex items-center justify-end gap-3 border-t border-grid px-6 py-4 bg-surface-2">

      {% csrf_token %}

      <button type="button"
              @click="fechar()"
              class="rounded-sm border border-grid bg-surface px-4 py-2 text-sm font-semibold text-ink-2 hover:bg-surface hover:text-ink transition-colors">
        Cancelar
      </button>

      <button type="submit"
              class="rounded-sm bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-700 transition-colors shadow-sm">
        Sim, excluir item
      </button>
    </form>
  </div>
</div>
