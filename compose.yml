services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=pt-BR --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${WEB_BIND_ADDRESS}:${WEB_PORT}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      # 120s cobre o `migrate` do entrypoint rodando contra base
      # vazia/recém-criada sem o compose marcar o container unhealthy no meio
      # do processo.
      start_period: 120s

volumes:
  # Nomeado, SEM `external: true` nesta fase (Assumption A4): um clone novo
  # precisa subir sozinho com `docker compose up -d`, sem passo manual de
  # `docker volume create`. Externalizar o volume (proteção contra `down -v`
  # apagar o banco) é decisão de operação real, revisitada quando este
  # template gerar um sistema que vai a produção (Fase 4/INF-03).
  pgdata:
