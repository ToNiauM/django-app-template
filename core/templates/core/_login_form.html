<form id="login-form" hx-post="{% url 'core:login' %}" hx-target="#login-form" hx-swap="outerHTML"
      class="flex flex-col gap-3">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next|default:'' }}">
  <div class="flex flex-col gap-1">
    <label for="id_email">E-mail</label>
    <input type="email" id="id_email" name="email" value="{{ email|default:'' }}" required autofocus
           class="border rounded px-3 py-2">
  </div>
  <div class="flex flex-col gap-1">
    <label for="id_password">Senha</label>
    <input type="password" id="id_password" name="password" required
           class="border rounded px-3 py-2">
  </div>
  {% if bloqueado %}
    <p class="text-red-600 text-sm">Muitas tentativas de acesso. Por segurança, novas tentativas estão bloqueadas temporariamente — aguarde e tente novamente em alguns minutos.</p>
  {% elif erro %}
    <p class="text-red-600 text-sm">E-mail ou senha inválidos.</p>
  {% endif %}
  <button type="submit" class="bg-blue-700 text-white rounded px-4 py-2">Entrar</button>
</form>
